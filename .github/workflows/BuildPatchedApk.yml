name: Build Patched APK

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'Release notes for this build'
        required: false
        default: ''
      release_tag:
        description: 'Release tag to create/update (asset is uploaded with --clobber)'
        required: false
        default: 'v0.10.1-phase9.1'

env:
  APK_FILE: Instagram-v435.0.0.37.76-patches-v3.8.0.apk
  OUT_APK: Instagram-v435.0.0.37.76-InstaTrueReel-signed.apk
  KS_PASS: instatruereel2026

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout repo (with LFS for the APK)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android build-tools (zipalign + apksigner)
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0'

      - name: Download apktool
        run: |
          curl -sL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          java -jar apktool.jar --version

      - name: Decode smali (resources passthrough, -r)
        run: |
          echo "Decoding $APK_FILE (10-25 min)..."
          java -Xmx6g -jar apktool.jar d -r -f -o decoded "$APK_FILE" 2>&1 | tail -8
          echo "smali files: $(find decoded -name '*.smali' | wc -l)"
          ls -d decoded/smali* | wc -l

      - name: Apply InstaTrueReel patches (v10, rotation-fight fix)
        run: |
          python3 patches/apply_patches.py decoded 2>&1 | tee patch_report.txt

      - name: Rebuild APK (apktool b, resources passthrough)
        run: |
          echo "Rebuilding (15-40 min)..."
          java -Xmx6g -jar apktool.jar b decoded -o unsigned.apk 2>&1 | tail -15
          ls -lh unsigned.apk

      - name: Zipalign
        run: |
          $ANDROID_HOME/build-tools/34.0.0/zipalign -f -p 4 unsigned.apk aligned.apk
          ls -lh aligned.apk

      - name: Sign (apksigner v1+v2+v3)
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks signing/instatruereel.jks \
            --ks-key-alias instatruereel \
            --ks-pass pass:$KS_PASS \
            --key-pass pass:$KS_PASS \
            --out "$OUT_APK" \
            aligned.apk
          ls -lh "$OUT_APK"

      - name: Verify signature
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$OUT_APK" | head -12

      - name: Verify patches are inside the final APK
        run: |
          mkdir -p finalcheck && cd finalcheck
          unzip -o "../$OUT_APK" classes13.dex classes16.dex classes17.dex >/dev/null
          python3 - <<'EOF'
          import sys
          ok = True
          def check(dex, needle, label):
              global ok
              data = open(dex, 'rb').read()
              found = needle.encode() in data
              print(f"  [{' ok ' if found else 'FAIL'}] {label} ({dex})")
              ok = ok and found
          # classes13 hosts 1fC/1fI + 0bQ/0bI + 6mW: helper type string proves the
          # interceptor + tab-bar gate + ORIENTATION-LOCK GATE call-sites compiled.
          check('classes13.dex', 'TTrueReelHelper', 'interceptor + tab-bar + orientation gates (1fC/1fI/0bQ/0bI/6mW) present')
          # classes16 hosts the helper + reapply + viewsave classes + fragments:
          # v0.7 strings prove the gap-closure + telemetry body is inside.
          check('classes16.dex', 'TTrueReelHelper', 'helper class defined')
          check('classes16.dex', 'TTrueReelReapply', 'reapply runnable present')
          check('classes16.dex', 'TTrueReelViewSave', 'v0.6 view-save state class present')
          check('classes16.dex', 'InstaTrueReel v0.10.1', 'v0.10.1 toast marker present')
          check('classes16.dex', 'TTrueReelClick', 'v0.9 click listener class present')
          check('classes16.dex', 'TTrueReelRecheck', 'v0.9 recheck listener class present')
          check('classes16.dex', 'TTrueReelTouch', 'v0.10 tap-spy listener class present')
          check('classes16.dex', 'TTrueReelTick', 'v0.10 landscape tick class present')
          check('classes16.dex', 'TTrueReelTap', 'v0.10 delayed-tap class present')
          check('classes16.dex', 'v0.10 fs: landscape engaged (overlay player)', 'v0.10 overlay-player enter marker present')
          check('classes16.dex', 'v0.10 fs: overlay player built', 'v0.10 overlay builder marker present')
          check('classes16.dex', 'v0.10.1 fs: video adopted', 'v0.10.1 video-adoption marker present')
          check('classes16.dex', 'v0.10.1 fs: adoption failed', 'v0.10.1 adopt-failure bail marker present')
          check('classes16.dex', 'v0.10.1 liberate: skipped', 'v0.10.1 portrait-surgery gate marker present')
          check('classes16.dex', 'fsAdoptAt', 'v0.10.1 adopt-clock field marker present')
          check('classes16.dex', 'v0.10 fs: auto-exit (portrait video swiped in)', 'v0.10 page-change auto-exit marker present')
          check('classes16.dex', 'v0.10 fs: back to portrait', 'v0.10 exit marker present')
          check('classes16.dex', 'v0.9 fs: portrait-lock blocked', 'v0.9.1 orientation-gate block log present')
          check('classes16.dex', 'v0.9 restore skipped (fs transient)', 'v0.9.1 transient-rotation guard present')
          check('classes16.dex', 'v0.9 hook: restore src=', 'v0.9.1 hook-source logging present')
          check('classes16.dex', 'v0.7 liberate: ', 'v0.7 liberation + height telemetry present')
          check('classes16.dex', 'v0.7 liberate: chain freed', 'v0.7 liberation summary present')
          check('classes16.dex', 'v0.7 close: ', 'v0.7 gap-closure diagnostics present')
          check('classes16.dex', 'v0.7 gaps closed (n=', 'v0.7 gap-closure summary present')
          check('classes16.dex', 'v0.7 tree: dump complete (n=', 'v0.7 bottom-strip dump present')
          check('classes16.dex', 'v0.7 restore-layout: heights restored', 'v0.7 height-restore present')
          check('classes16.dex', 'v0.6 restore-layout: chain restored', 'v0.6 chain-restore diagnostics present')
          check('classes16.dex', 'v0.8 overlay: ', 'v0.8 strip-overlay telemetry present')
          check('classes16.dex', 'v0.8 restore: strip overlay reverted', 'v0.8 overlay-restore present')
          check('classes16.dex', 'GestureManagerFrameLayout', 'v0.8 video-container finder present')
          check('classes16.dex', 'ClipsSwipeRefreshLayout', 'v0.8 fallback finder present')
          check('classes16.dex', 'v0.9 apply: edge-to-edge + fullscreen armed', 'v0.9 apply marker present')
          # classes17 hosts 2Iv + 2ZS: helper string proves the lerp gate.
          check('classes17.dex', 'TTrueReelHelper', '2ZS/2Iv gate call-sites present')
          sys.exit(0 if ok else 1)
          EOF

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: InstaTrueReel-patched-apk
          path: ${{ env.OUT_APK }}
          retention-days: 30
          if-no-files-found: error

      - name: Upload patch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-report
          path: |
            patch_report.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Create/update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          NOTES=$(cat <<'EON'
          **InstaTrueReel v0.10.0 - THE OVERLAY PLAYER (phase 9: real TikTok
          landscape fullscreen + Android 16 crash fix).**

          v0.9.x fought Instagram's portrait layout and lost (top black bar,
          floating chrome, spurious exits). v0.10 stops fighting: tapping
          "Full screen" now ADOPTS the video TextureView into our own
          decor-level overlay. Research into the Groot video glue
          (X/1j4 "GrootReuseTextureViewControllerImpl") proved the
          SurfaceTextureListener set on every reels TextureView re-binds the
          surface after any re-attach - so the video keeps playing, edge to
          edge, and Instagram's layout code can never touch it.

          The landscape player is now TikTok-style:
          * Top info bar - gradient, back arrow, username/caption title
          * Center play/pause indicator while paused (taps pass through to
            Instagram's real gesture pipeline: tap = pause, double-tap = like,
            swipe = next reel - all native)
          * Bottom bar - gradient + horizontal action row: like (heart flashes
            red), comment + share (they exit to portrait and open the real
            sheets)
          * Side rail, caption chrome, bottom nav: all hidden behind the
            opaque player

          Swipe to another landscape reel while fullscreen: the new video is
          adopted automatically (swap). Swipe to a portrait reel: clean
          auto-exit to portrait. NO MORE measurement-based auto-exit - the
          v0.9.1 spurious exits (5s / 3.5s) are gone; page changes are
          detected by video identity, debounced, with an anti-mid-swipe time
          guard.

          ALSO FIXED - Android 16+ startup crash: a hand-written null-check
          idiom in helper A1E referenced the non-existent class
          android/lang/Object. Android <= 14 soft-failed it (swallowed by the
          try/catch); Android 16's stricter verifier hard-rejects the whole
          helper class -> instant crash on open. Now java/lang/Object, and
          the whole helper audited for unresolved references.

          Expected on-device: tap "Full screen" on a landscape reel -> the
          app rotates; video fills the screen edge-to-edge with the TikTok
          chrome; swipe to portrait reel -> clean return; back arrow or
          leaving Reels -> portrait restored. Toast: "InstaTrueReel v0.10.0:
          fullscreen ON". Diagnostics: adb logcat -s InstaTrueReel - watch
          for "overlay player built", "video adopted", "swapping video",
          "auto-exit (portrait video swiped in)".

          Known v0.10 limits (next phase): the bottom scrubber + timestamps
          need the HeroPlayer control surface (research mapped: X/1c8 /
          X/1cN A0N/A0O/A04 - see ROADMAP Phase 10); comment/share exit to
          portrait before opening their sheets.

          ${{ github.event.inputs.notes }}
          EON
          )
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists - uploading asset (clobbering old one)."
            gh release upload "$TAG" "$OUT_APK" --clobber
          else
            gh release create "$TAG" "$OUT_APK" \
              --title "InstaTrueReel $TAG - the overlay player (real TikTok landscape fullscreen)" \
              --notes "$NOTES"
          fi

      - name: Summary
        run: |
          {
            echo "## InstaTrueReel Build (v0.10.0 — the overlay player)"
            echo ""
            echo "- Input: \`$APK_FILE\`"
            echo "- Output: \`$OUT_APK\` ($(ls -lh "$OUT_APK" 2>/dev/null | awk '{print $5}'))"
            echo "- Core patch: 9Wz.EEr() forced true (IG native edge-to-edge reels mode)"
            echo "- Interceptors: 1fC.A04 (status bar) + 1fI.A04 (nav bar)"
            echo "- v0.6 kept: chain liberation walk (STATUS BAR FIXED everywhere)"
            echo "- v0.7 kept: bottom-gap closure A15/A16 + h=/ph= telemetry"
            echo "- v0.8 kept: strip overlay A19/A1A/A1B/A1C/A1D/A1E (comment-bar fix)"
            echo "- v0.9 kept: TikTok-style horizontal fullscreen A20-A27 + pill +"
            echo "  sensor-landscape rotation + x exit button"
            echo "- KEPT v0.9.1: 6mW.A00 orientation gate (A28), transient guard,"
            echo "  hook-source logging A2B..A2F"
            echo "- NEW v0.10: THE OVERLAY PLAYER - video TextureView adopted into a"
            echo "  decor-level overlay (A2G/A2H/A2J): TikTok chrome (top bar +"
            echo "  back + title, center pause via non-consuming tap-spy A2N,"
            echo "  bottom action row like/comment/share via synthetic taps on the"
            echo "  real rail buttons A2M/A2P/A2Q/A2R/A2S), 500ms landscape tick"
            echo "  A2K (geometry re-assert + video-identity page-change detection"
            echo "  with anti-mid-swipe guard + one-shot surface sanity check)"
            echo "- NEW v0.10: helper A1E android/lang/Object -> java/lang/Object"
            echo "  (Android 16 VerifyError startup crash fixed)"
            echo "- 3 new classes: TTrueReelTouch (tap-spy), TTrueReelTick,"
            echo "  TTrueReelTap (delayed taps)"
            echo "- Release tag: ${{ github.event.inputs.release_tag }}"
            echo "- Notes: ${{ github.event.inputs.notes }}"
          } >> "$GITHUB_STEP_SUMMARY"
